<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="card">
    <div class="brand">🔐 Secure Login</div>
    <h1>Create account</h1>
    <p class="subtitle">Your password will be securely hashed.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Username</label>
        <input name="username" minlength="3" maxlength="30" required autocomplete="username">

        <label>Email</label>
        <input name="email" type="email" maxlength="120" required autocomplete="email">

        <label>Password</label>
        <input name="password" type="password" minlength="8" maxlength="72"
               required autocomplete="new-password">

        <button type="submit">Create Account</button>
    </form>

    <p class="switch">Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>
</main>
</body>
</html>
